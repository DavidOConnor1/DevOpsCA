name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/ci-setup ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]

permissions:
  contents: write
  security-events: write   
  actions: read     

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true          

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm ci
        
      - name: Run linter
        run: npm run lint

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm ci
        
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test

  build:
    needs: [lint, security-scan, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run build (if exists)
        run: |
          if npm run | grep -q build; then
            npm run build
          else
            echo "No build script found, skipping..."
          fi
      
      - name: Create dist folder for artifact
        run: |
          mkdir -p dist
          # Copy all essential app files to dist
          cp -r \
            app.js \
            bin/ \
            routes/ \
            views/ \
            public/ \
            package.json \
            package-lock.json \
            node_modules/ \
            dist/ 2>/dev/null || :
          echo "✅ Files copied to dist folder:"
          ls -la dist/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
      
      - name: Create Release
        uses: elgohr/Github-Release-Action@v5
        with:
          title: Dev Build ${{ github.sha }}
          tag: dev-${{ github.sha }}
          prerelease: true

  deploy-to-ec2:
    needs: [release]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
    
      - name: Add EC2 host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
    
      - name: Deploy application
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            set -e
            
            echo 'Starting deployment...'
            cd ~/DevOpsCA || { echo '❌ App directory not found'; exit 1; }
            
            echo 'Pulling latest code...'
            git pull origin main
            
            echo '🔧 Installing production dependencies...'
            npm ci --production
            
            echo '🔄 Restarting application...'
            pm2 restart example_app --update-env || {
              echo 'App not running, starting fresh...'
              pm2 start ./bin/www --name example_app --env=production
            }
            
            echo '💾 Saving PM2 configuration...'
            pm2 save
            
            echo 'Deployment complete!'
          "
      
      - name: Health check
        run: |
          echo '🔍 Checking application health...'
          sleep 10
          curl -f -k http://${{ secrets.EC2_HOST }}:8080/ || echo 'Health check endpoint not responding'